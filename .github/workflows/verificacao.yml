# Verificação automática a cada envio: testes de regra, compilação de todos os
# scripts Luau e build do Rojo. Não publica nada e não usa segredos.
name: Verificação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Luau e Rojo
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -q -o luau.zip -d "$HOME/bin"
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          unzip -q -o rojo.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/"*
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ls -la "$HOME/bin"

      - name: Verificadores em Python
        if: always()
        run: |
          python3 tools/check_blocks.py src/*/*.luau tests/*.luau
          python3 tools/lint_luau.py src/*/*.luau

      - name: Compilar todos os scripts (erros de sintaxe)
        if: always()
        run: |
          status=0
          for file in src/*/*.luau tests/*.luau; do
            luau-compile --binary "$file" > /dev/null || { echo "ERRO em $file"; status=1; }
          done
          exit $status

      - name: Testes de regra - inventário
        if: always()
        run: luau tests/inventory.spec.luau

      - name: Testes de regra - progressão
        if: always()
        run: luau tests/progression.spec.luau

      - name: Build do Rojo
        if: always()
        run: |
          mkdir -p build
          rojo build default.project.json -o build/GalaxyMiningSimulator.rbxlx
          ls -la build

      # Análise de tipos contra a API do Roblox. Informativa: não reprova o envio,
      # porque scripts sem anotações de tipo geram avisos que não são erros.
      - name: Análise de tipos (luau-lsp, informativa)
        if: always()
        continue-on-error: true
        run: |
          curl -sSLf -o lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/latest/download/luau-lsp-linux-x86_64.zip \
            || curl -sSLf -o lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/latest/download/luau-lsp-linux.zip
          unzip -q -o lsp.zip -d "$HOME/bin" && chmod +x "$HOME/bin/luau-lsp"
          curl -sSLf -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --sourcemap=sourcemap.json --definitions=globalTypes.d.luau \
            --ignore="tests/**" src 2>&1 | tee analise.txt || true
          echo "Linhas de aviso: $(wc -l < analise.txt)"
